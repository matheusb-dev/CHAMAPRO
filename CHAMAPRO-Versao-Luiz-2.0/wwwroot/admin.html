<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHAMAPRO | Administração</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <h1>CHAMAPRO Admin</h1>
      </div>
      <div class="topbar-actions">
        <span id="userLabel">Usuário</span>
        <button id="logoutBtn" class="secondary-btn">Sair</button>
      </div>
    </header>

    <div id="alert" class="alert" role="alert"></div>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="subtitle">Usuários</div>
        <div id="usuariosTotal" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="subtitle">Pedidos</div>
        <div id="pedidosTotal" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="subtitle">Verificações</div>
        <div id="verificacoesTotal" class="stat-value">0</div>
      </div>
    </section>

    <section class="grid-two">
      <div class="panel">
        <h3>Usuários</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Perfil</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="usuariosTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h3>Pedidos recentes</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="pedidosTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
