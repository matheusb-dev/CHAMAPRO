<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHAMAPRO | Cadastro</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-shell">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <h2>Cadastro</h2>
      </div>
    </div>

    <p class="subtitle">Crie sua conta e comece a usar o CHAMAPRO.</p>

    <div id="alert" class="alert" role="alert"></div>

    <form id="cadastroForm" class="form-grid">
      <label>
        Nome
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required />
      </label>

      <label>
        E-mail
        <input type="email" id="email" name="email" placeholder="seu@email.com" required />
      </label>

      <label>
        Senha
        <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required />
      </label>

      <label>
        Tipo de conta
        <select id="tipo" name="tipo">
          <option value="cliente">Cliente</option>
          <option value="profissional">Profissional</option>
        </select>
      </label>

      <button type="submit" class="primary-btn">Criar conta</button>
    </form>

    <div class="inline-actions" style="margin-top: 18px;">
      <span>Já tem conta?</span>
      <a href="/login.html" class="link-button">Fazer login</a>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
