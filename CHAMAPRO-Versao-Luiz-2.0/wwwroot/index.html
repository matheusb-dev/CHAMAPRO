<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CHAMAPRO | Encontre profissionais</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="container">
  <header class="topbar"><h1>CHAMAPRO</h1><div class="topbar-actions" id="navAuth"></div></header>
  <section class="hero panel"><h1>Encontre o profissional certo, perto de você</h1><p class="subtitle">Escolha a categoria e a cidade, compare notas e preços e peça orçamentos.</p>
    <form id="busca" class="search-bar">
      <label>Categoria<select id="categoria" name="categoriaId" required></select></label>
      <label>Cidade<input name="cidade" placeholder="Ex.: São Paulo" maxlength="100" required></label>
      <label>Ordenar<select name="ordenar"><option value="nota">Melhor nota</option><option value="avaliacoes">Mais avaliados</option><option value="preco">Menor preço</option></select></label>
      <label><input type="checkbox" name="verificado"> Só verificados</label>
      <button class="primary-btn" type="submit">Buscar</button>
    </form></section>
  <div id="alert" class="alert" role="alert"></div>
  <div id="resultado"></div><div id="pager" class="inline-actions" style="margin-top:16px"></div>
</div>
<script src="/js/config.js"></script><script src="/js/mocks.js"></script><script src="/js/api.js"></script><script src="/js/home.js"></script></body></html>
