<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAMAPRO | Meu perfil</title><link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/pages/app.css"></head>
<body><header data-app-header></header><div class="app-layout"><aside data-app-sidebar></aside><main class="app-main"><div class="app-content"><section class="page-heading"><span class="text-primary">CONTA</span><h1>Meu perfil</h1><p>Mantenha seus dados de contato e localização atualizados.</p></section><form id="clientProfileForm" class="app-card app-form"><div class="form-group"><label for="name">Nome completo</label><input id="name" required minlength="3" maxlength="100"></div><div class="app-form-grid"><div class="form-group"><label for="phone">Telefone com DDD</label><input id="phone" required inputmode="numeric" pattern="[0-9]{10,11}" maxlength="11"></div><div class="form-group"><label for="city">Cidade</label><input id="city" required maxlength="100"></div><div class="form-group"><label for="neighborhood">Bairro</label><input id="neighborhood" maxlength="100"></div><div class="form-group"><label for="contact">Preferência de contato</label><select id="contact"><option value="">Sem preferência</option><option value="WhatsApp">WhatsApp</option><option value="Telefone">Telefone</option><option value="Email">E-mail</option></select></div><div class="form-group full"><label for="address">Endereço principal (opcional)</label><input id="address" maxlength="250"></div><div class="form-group full"><label for="photoFile">Foto de perfil</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><small class="app-muted">JPG, PNG ou WEBP, até 5 MB.</small><input id="photo" type="url" maxlength="300" placeholder="URL da foto atual, se já houver"></div></div><label><input id="whatsappActive" type="checkbox"> Permitir contato pelo WhatsApp após a contratação</label><div class="form-group"><label for="whatsappMessage">Mensagem inicial do WhatsApp (opcional)</label><input id="whatsappMessage" maxlength="300" placeholder="Olá, estou entrando em contato pelo CHAMAPRO."></div><p id="formMessage" class="app-message" role="status"></p><button class="btn btn-primary" type="submit">Salvar perfil</button></form></div></main></div><script src="../../js/api.js" defer></script><script src="../../js/components/header.js" defer></script><script src="../../js/components/sidebar.js" defer></script><script src="../../js/components/notifications.js" defer></script><script src="../../js/app.js" defer></script><script src="../../js/pages/cliente.js" defer></script></body></html>
