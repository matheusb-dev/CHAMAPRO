<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAMAPRO | Criar chamado</title><link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/pages/app.css"></head>
<body><header data-app-header></header><div class="app-layout"><aside data-app-sidebar></aside><main class="app-main"><div class="app-content"><section class="page-heading"><span class="text-primary">NOVO SERVIÇO</span><h1>Criar chamado</h1><p>Descreva o que precisa e direcione o chamado para profissionais compatíveis.</p></section><form id="createOrderForm" class="app-card app-form"><div class="app-form-grid"><div class="form-group"><label for="category">Categoria</label><select id="category" required><option value="">Carregando categorias…</option></select></div><div class="form-group"><label for="title">Título</label><input id="title" required minlength="5" maxlength="80" placeholder="Ex.: consertar vazamento na cozinha"></div><div class="form-group full"><label for="description">Descrição</label><textarea id="description" required minlength="10" maxlength="1000" placeholder="Conte os detalhes que ajudam o profissional a entender o serviço."></textarea></div><div class="form-group"><label for="city">Cidade</label><input id="city" required maxlength="100" autocomplete="address-level2"></div><div class="form-group"><label for="neighborhood">Bairro</label><input id="neighborhood" maxlength="100" autocomplete="address-level3"></div><div class="form-group full"><label for="address">Endereço (opcional)</label><input id="address" maxlength="250" autocomplete="street-address"></div><div class="form-group"><label for="serviceType">Tipo de atendimento</label><select id="serviceType"><option value="IMEDIATO">Imediato</option><option value="AGENDADO">Agendado</option></select></div><div class="form-group" id="desiredDateGroup" hidden><label for="desiredDate">Data e horário desejados</label><input type="datetime-local" id="desiredDate"></div><div class="form-group full"><label for="photos">Fotos do serviço (opcional, até 5)</label><input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple><span class="form-hint">Imagens JPG, PNG ou WEBP de até 5 MB cada.</span></div><fieldset class="form-group full"><legend>Como direcionar</legend><label><input type="radio" name="distribution" value="auto" checked> Distribuir para até cinco profissionais verificados compatíveis</label><label><input type="radio" name="distribution" value="manual"> Escolher profissionais individualmente</label></fieldset><div class="form-group full" id="professionalPicker" hidden><button type="button" class="btn btn-secondary" id="searchProfessionals">Buscar profissionais para esta região</button><div id="professionalList" class="app-stack"></div></div></div><p id="formMessage" class="app-message" role="status"></p><div class="app-actions"><button class="btn btn-primary" type="submit">Revisar chamado</button><a class="btn btn-secondary" href="painel.html">Cancelar</a></div></form><section id="reviewPanel" class="app-card" hidden style="margin-top:18px"><h2>Revise os dados do chamado</h2><div id="reviewSummary"></div><p id="reviewMessage" class="app-message" role="status"></p><div class="app-actions"><button id="backToEdit" class="btn btn-secondary" type="button">Editar dados</button><button id="confirmOrder" class="btn btn-primary" type="button">Confirmar chamado</button></div></section></div></main></div>
<script src="../../js/api.js" defer></script><script src="../../js/components/header.js" defer></script><script src="../../js/components/sidebar.js" defer></script><script src="../../js/components/notifications.js" defer></script><script src="../../js/app.js" defer></script><script src="../../js/pages/cliente.js" defer></script></body></html>
