<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAMAPRO | Detalhe do chamado</title><link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/pages/app.css"></head>
<body><header data-app-header></header><div class="app-layout"><aside data-app-sidebar></aside><main class="app-main"><div class="app-content"><a href="fila-chamados.html" class="app-muted">← Voltar à fila</a><div id="orderDetail" class="app-stack" style="margin-top:18px"><p class="empty-state">Carregando chamado…</p></div><section id="quoteSection" class="app-card app-form" hidden style="margin-top:20px"><h2>Enviar orçamento</h2><form id="quoteForm"><div class="app-form-grid"><div class="form-group"><label for="quoteValue">Valor (R$)</label><input id="quoteValue" type="number" step="0.01" min="0.01" required></div><div class="form-group"><label for="quoteDeadline">Prazo estimado</label><input id="quoteDeadline" maxlength="100" required placeholder="Ex.: 2 horas"></div><div class="form-group full"><label for="quoteConditions">Condições e detalhes</label><textarea id="quoteConditions" maxlength="500"></textarea></div></div><p id="quoteMessage" class="app-message"></p><button class="btn btn-primary" type="submit">Enviar orçamento</button></form></section><section id="scheduleSection" class="app-card app-form" hidden style="margin-top:20px"><h2>Agendar serviço</h2><form id="scheduleForm"><div class="form-group"><label for="scheduleDate">Data e horário</label><input id="scheduleDate" type="datetime-local" required></div><p id="scheduleMessage" class="app-message"></p><button class="btn btn-primary" type="submit">Confirmar agendamento</button></form></section></div></main></div><script src="../../js/api.js" defer></script><script src="../../js/components/header.js" defer></script><script src="../../js/components/sidebar.js" defer></script><script src="../../js/components/notifications.js" defer></script><script src="../../js/app.js" defer></script><script src="../../js/pages/trabalhador.js" defer></script></body></html>
