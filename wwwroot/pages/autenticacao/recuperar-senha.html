<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111310">
    <meta name="description" content="Recupere o acesso à sua conta CHAMAPRO.">
    <title>CHAMAPRO | Recuperar senha</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/pages/autenticacao.css">
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="auth-form-section">
            <div class="auth-form-wrapper">
                <a href="../../index.html" class="brand">
                    <span class="brand-symbol">C</span>
                    <span class="brand-name">CHAMA<span>PRO</span></span>
                </a>
                <div class="auth-heading">
                    <span class="auth-eyebrow">ACESSO À CONTA</span>
                    <h1 id="pageTitle">Recuperar senha</h1>
                    <p id="pageDescription">Informe o e-mail da sua conta para receber um link seguro.</p>
                </div>
                <form id="requestForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required>
                    </div>
                    <p id="requestMessage" class="auth-message" role="status" aria-live="polite"></p>
                    <button class="login-button" type="submit">Enviar instruções</button>
                </form>
                <form id="resetForm" class="auth-form" hidden>
                    <div class="form-group">
                        <label for="newPassword">Nova senha</label>
                        <input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar nova senha</label>
                        <input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                    </div>
                    <p id="resetMessage" class="auth-message" role="status" aria-live="polite"></p>
                    <button class="login-button" type="submit">Salvar nova senha</button>
                </form>
                <div class="signup-link"><a href="login.html">Voltar ao login</a></div>
            </div>
        </section>
    </main>
    <script src="../../js/pages/recuperar-senha.js" defer></script>
</body>
</html>
